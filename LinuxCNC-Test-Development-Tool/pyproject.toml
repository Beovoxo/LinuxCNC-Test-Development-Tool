[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxcnc-test-development-tool"
version = "1.0.0"
description = "Generic LinuxCNC diagnostics and system inventory GUI"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = ["PySide6>=6.6", "psutil>=5.9", "reportlab>=4.0"]

[project.scripts]
linuxcnc-test-tool = "linuxcnc_tool.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
